<section id="authScreen">
  <div class="auth-card">
    <h1>Welcome to GlobalQuery</h1>

    <p id="authMessage">
      Finish setting up your account.
    </p>

    <form id="setPasswordForm">
      <label for="newPassword">
        Password
      </label>

      <input
        id="newPassword"
        type="password"
        minlength="8"
        required
      >

      <button type="submit">
        Set Password
      </button>
    </form>
  </div>
</section>

<main id="app" hidden>
  <!-- GlobalQuery UI goes here -->
</main>
